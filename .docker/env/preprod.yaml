services:
  backend:
    image: "${CI_REGISTRY_IMAGE:-registry.gitlab.com/dronexperts/formation}/backend:preprod"
    container_name: "dronosphere_dronexperts-formation_preprod_backend"
    hostname: "preprod_dronexperts-formation_backend"
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      APP_ENV: "preprod"
      FRONTEND_URL: "https://preprod.formation.dronexperts.io"
      APP_DB_HOST: "pgsql"
      APP_DB_PORT: "5432"
      APP_DB_USERNAME: "${PREPROD_DB_USER:-dronexperts-formation-preprod}"
      APP_DB_PASSWORD: "${DB_PASSWORD}"
      APP_DB_NAME: "${PREPROD_DB_NAME:-dronexperts-formation-preprod}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      BREVO_API_KEY: "${BREVO_API_KEY}"
    volumes:
      - /srv/docker/dronexperts-formation/preprod/uploads:/app/uploads
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      app: ~
      dronosphere_reverse-proxy: ~
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dronosphere_reverse-proxy"
      - "traefik.http.routers.dronexperts-backend-preprod.rule=Host(`api.preprod.formation.dronexperts.io`)"
      - "traefik.http.routers.dronexperts-backend-preprod.entrypoints=websecure"
      - "traefik.http.routers.dronexperts-backend-preprod.tls=true"
      - "traefik.http.routers.dronexperts-backend-preprod.tls.certresolver=ovh"
      - "traefik.http.services.dronexperts-backend-preprod.loadbalancer.server.port=3001"

  frontend:
    image: "${CI_REGISTRY_IMAGE:-registry.gitlab.com/dronexperts/formation}/frontend:preprod"
    container_name: "dronosphere_dronexperts-formation_preprod_frontend"
    hostname: "preprod_dronexperts-formation_frontend"
    restart: unless-stopped
    depends_on:
      - backend
      - prerender
    networks:
      app: ~
      dronosphere_reverse-proxy: ~
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dronosphere_reverse-proxy"
      - "traefik.http.routers.dronexperts-frontend-preprod.rule=Host(`preprod.formation.dronexperts.io`)"
      - "traefik.http.routers.dronexperts-frontend-preprod.entrypoints=websecure"
      - "traefik.http.routers.dronexperts-frontend-preprod.tls=true"
      - "traefik.http.routers.dronexperts-frontend-preprod.tls.certresolver=ovh"
      - "traefik.http.routers.dronexperts-frontend-preprod.middlewares=dronexperts-frontend-preprod-auth"
      - "traefik.http.services.dronexperts-frontend-preprod.loadbalancer.server.port=80"
      - "traefik.http.middlewares.dronexperts-frontend-preprod-auth.basicauth.users=${BASICAUTH_USERS}"

  prerender:
    container_name: "dronosphere_dronexperts-formation_preprod_prerender"
    hostname: "preprod_dronexperts-formation_prerender"

  pgsql:
    container_name: "dronosphere_dronexperts-formation_preprod_pgsql"
    hostname: "preprod_dronexperts-formation_pgsql"
    environment:
      POSTGRES_USER: "${PREPROD_DB_USER:-dronexperts-formation-preprod}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-dronexperts-formation-preprod}"
      POSTGRES_DB: "${PREPROD_DB_NAME:-dronexperts-formation-preprod}"
    volumes:
      - /srv/docker/dronexperts-formation/preprod/pgsql:/var/lib/postgresql/data

  redis:
    container_name: "dronosphere_dronexperts-formation_preprod_redis"
    hostname: "preprod_dronexperts-formation_redis"
    volumes:
      - /srv/docker/dronexperts-formation/preprod/redis:/data

networks:
  app:
    name: "dronosphere_dronexperts-formation_preprod"
  dronosphere_reverse-proxy:
    external: true
