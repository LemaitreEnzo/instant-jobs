services:
  backend:
    container_name: "instant-jobs_backend"
    hostname: "dev_instant-jobs_backend"
    environment:
      PORT: "3000"
      VERSION: "v1"
      DB_HOST: "pgsql"
      DB_PORT: "5432"
      DB_NAME: "instant_jobs"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
    ports:
      - "3000:3000"
    volumes:
      - "../../../backend:/usr/src/backend"
      - "../../../backend/dist:/usr/src/backend/dist"

  frontend:
    container_name: "instant-jobs_frontend"
    hostname: "dev_instant-jobs_frontend"
    environment:
      FRONTEND_PORT: "5173"
      VITE_API_URL: "https://api-instant-jobs.duckdns.org"
    ports:
      - "5173:5173"
    volumes:
      - "../../../frontend:/usr/src/frontend"

  pgsql:
    container_name: "instant-jobs_pgsql"
    ports:
      - "5432:5432"

  adminer:
    container_name: "instant-jobs_adminer"
    hostname: "dev_instant-jobs_adminer"
    ports:
      - "8080:8080"

networks:
  proxy:
    driver: bridge
    external: true
