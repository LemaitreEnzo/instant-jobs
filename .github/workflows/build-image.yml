name: Build Docker Image
on:
  workflow_run:
    workflows: ["Code quality and testing"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Extract backend metadata
        id: meta-back
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lemaitreenzo/instant-jobs-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Extract frontend metadata
        id: meta-front
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lemaitreenzo/instant-jobs-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./.docker/node/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-back.outputs.tags }}
          labels: ${{ steps.meta-back.outputs.labels }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./.docker/frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_BASE_API_URL=${{ secrets.API_URL }}
            VITE_API_VERSION=${{ secrets.API_VERSION }}
          tags: ${{ steps.meta-front.outputs.tags }}
          labels: ${{ steps.meta-front.outputs.labels }}
