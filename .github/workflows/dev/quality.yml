name: Code quality and testing

on:
  push:
    branches:
      - dev

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    # Setup a local database instance inside CI to validate migrations
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.dev.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.dev.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.dev.POSTGRES_DB }}
        ports:
          - 5432:5432
        # Ensure postgres is healthy before running steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Linter
        run: |
          cd backend
          npm run lint

      - name: Run Sequelize Migrations
        env:
          NODE_ENV: dev
          DB_USERNAME: ${{ secrets.dev.DB_USER }}
          DB_PASSWORD: ${{ secrets.dev.DB_PASSWORD }}
          DB_NAME: ${{ secrets.dev.DB_NAME }}
          DB_HOST: ${{ secrets.dev.DB_HOST }}
          DB_DIALECT: postgres
        run: |
          cd backend
          npx sequelize-cli db:migrate

      - name: Run Backend Tests
        env:
          NODE_ENV: dev
          DB_USERNAME: ${{ secrets.dev.DB_USER }}
          DB_PASSWORD: ${{ secrets.dev.DB_PASSWORD }}
          DB_NAME: ${{ secrets.dev.DB_NAME }}
          DB_HOST: ${{ secrets.dev.DB_HOST }}
        run: |
          cd backend
          npm test

  # --- FRONTEND JOB ---
  frontend-ci:
    needs: backend-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Linter & Tests
        run: |
          cd frontend
          npm run lint
          npm test -- --watchAll=false

      - name: Build React Application
        run: |
          cd frontend
          npm run build

      # Upload production build bundle for the deployment step
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: frontend/dist
