name: Code quality and testing

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: instant_jobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: instant_jobs
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 3000
      VERSION: v1
      SECRET: ci-secret
      TOKEN: ci-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npx tsc -p . && npx tsc-alias

      - name: Run Sequelize Migrations
        working-directory: backend
        run: >
          npx sequelize-cli db:migrate
          --config dist/src/db/config.js
          --migrations-path dist/src/db/migrations

      - name: Run Backend Tests
        working-directory: backend
        run: npm test

  frontend-ci:
    needs: backend-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Linter
        working-directory: frontend
        run: npm run lint

      - name: Build React Application
        working-directory: frontend
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: frontend/dist
